[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoro-ai"
version = "0.1.0"
description = "Local-first CLI agentic development orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "filelock>=3.16",
  "httpx>=0.27",
  "openai>=1.55",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "questionary>=2.0",
  "rich>=13.9",
  "tenacity>=9.0",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-httpx>=0.35", "ruff>=0.8"]

[project.scripts]
zoro = "zoro.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["zoro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 220
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
